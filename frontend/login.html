<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión | Reserva Campus</title>
    <link rel="stylesheet" href="css/styles.css">
  </head>
  <body data-page="login">
    <header class="site-header"><nav class="nav" aria-label="Navegación principal"><a class="brand" href="index.html"><span class="brand-mark">RC</span>Reserva Campus</a><div class="nav-links"><a href="spaces.html">Espacios</a><a href="reservations.html">Reservar</a><a data-login-link href="login.html">Iniciar sesión</a><button class="nav-action" data-logout-button type="button" hidden>Cerrar sesión</button></div></nav></header>
    <main class="login-shell">
      <form class="login-card" data-auth-form>
        <h1 data-auth-title>Te damos la bienvenida</h1><p data-auth-description>Inicia sesión para solicitar, consultar o administrar tus reservas.</p>
        <div class="field" data-name-field hidden><label for="name">Nombre completo</label><input id="name" name="name" type="text" autocomplete="name" maxlength="120"></div>
        <div class="field"><label for="email">Correo electrónico</label><input id="email" name="email" type="email" autocomplete="email" maxlength="255" required></div>
        <div class="field"><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" minlength="12" maxlength="72" required></div>
        <p class="feedback" data-feedback role="status" aria-live="polite" hidden></p>
        <button class="button button-primary" data-auth-submit type="submit">Iniciar sesión</button>
        <button class="text-button" data-auth-toggle type="button">Crear una cuenta</button>
      </form>
    </main>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
